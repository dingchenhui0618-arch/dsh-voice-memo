name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # Zero dependencies: the build is plain node:fs, the tests are node:test.
      - name: Build (zero dependencies)
        run: node scripts/build.mjs

      # lib/ is committed because users install the prebuilt package. A build
      # that disagrees with it means src/ was edited without rebuilding.
      - name: lib/ matches src/
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            git status --porcelain -- lib
            echo "::error::lib/ is out of date - run npm run build and commit the result"
            exit 1
          fi

      - name: Test
        run: node --test test/*.test.mjs
